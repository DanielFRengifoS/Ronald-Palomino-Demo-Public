<!doctype html><html lang="es"><meta charset="utf-8"><title>QA · Selector original</title><style>*{box-sizing:border-box}body{margin:0;background:#ddd;font:12px system-ui}header{padding:8px;background:#fff}button{padding:8px}iframe{width:100%;height:750px;border:0;display:block;margin:auto}body.mobile iframe{width:390px;height:844px}#log{white-space:pre-wrap;font-size:12px;margin:8px;max-height:100px;overflow:auto}</style><header><button onclick="document.body.className='';launch()">Selector escritorio</button><button onclick="document.body.className='mobile';launch()">Selector móvil</button><span id="live"></span><div id="log"></div></header><iframe title="Bienvenida y selector originales"></iframe><script>
const frame=document.querySelector('iframe'), log=document.querySelector('#log');let counts={},bound=new WeakSet(),timer;
function note(s){log.textContent+=s+'\n';log.scrollTop=log.scrollHeight;}
function launch(){try{frame.contentDocument?.querySelectorAll('.stage iframe').forEach(f=>{f.contentWindow.name='';});}catch{}frame.name='';clearInterval(timer);counts={};log.textContent='';frame.src='../../index.html?qa='+Date.now();}
frame.onload=()=>{timer=setInterval(()=>{const d=frame.contentDocument;if(!d)return;const welcome=!d.querySelector('#bienvenida').hidden;d.querySelectorAll('.stage iframe[src]').forEach(f=>{let child;try{child=f.contentDocument;if(!child?.querySelector('[data-gesture]'))return;}catch{return;}if(!bound.has(child)){bound.add(child);child.addEventListener('animationstart',e=>{const gesture=e.target.closest('[data-gesture]');if(!gesture)return;const opt=child.documentElement.dataset.rpOption;const key=opt+'/'+gesture.dataset.gesture;counts[key]=(counts[key]||0)+1;note(`${key} · ${e.animationName} · bienvenida visible=${!d.querySelector('#bienvenida').hidden} · opción activa=${f.classList.contains('is-on')}`);});} });document.querySelector('#live').textContent='Bienvenida '+(welcome?'visible':'terminada')+' · animationstart '+JSON.stringify(counts)+' · estados '+[...d.querySelectorAll('.stage iframe[src]')].map(f=>f.id+':'+f.contentDocument?.querySelector('.sf-scene')?.className).join(' / ');},30);};launch();
</script></html>
